services:
  - type: web
    name: booth-qr
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: booth-data
      mountPath: /var/data
      sizeGB: 1
